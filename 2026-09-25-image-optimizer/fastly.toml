# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = [""]
description = "Image Optimizer: sending an image request through Image Optimizer, with a fallback"
language = "other"
manifest_version = 3
name = "image-optimizer"
service_id = ""

[local_server]

  [local_server.backends]

    [local_server.backends.origin]
      url = "https://http-me.fastly.dev"

[scripts]
  build = "cargo build --target wasm32-wasip2 && mkdir -p bin && cp target/wasm32-wasip2/debug/image_optimizer.wasm bin/main.wasm"

[setup]

  [setup.backends]

    [setup.backends.origin]
      address = "http-me.fastly.dev"
      description = "http-me test origin, which serves a sample JPEG at /image-jpeg"
      port = 443
