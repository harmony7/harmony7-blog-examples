# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = [""]
description = "Next-Gen WAF: inspecting a request before deciding whether to forward it"
language = "other"
manifest_version = 3
name = "next-gen-waf"
service_id = ""

[local_server]

  [local_server.backends]

    [local_server.backends.origin]
      url = "https://http-me.fastly.dev"

[scripts]
  build = "cargo build --target wasm32-wasip2 && mkdir -p bin && cp target/wasm32-wasip2/debug/next_gen_waf.wasm bin/main.wasm"

[setup]

  [setup.backends]

    [setup.backends.origin]
      address = "http-me.fastly.dev"
      description = "http-me test origin"
      port = 443

  [setup.products]

    # Enables the Next-Gen WAF on the service and links a workspace. Replace
    # the ID with one of your own. Blocking mode and rules are set up in the
    # workspace itself, not here.
    [setup.products.ngwaf]
      enable = true
      workspace_id = "YOUR_WORKSPACE_ID"
