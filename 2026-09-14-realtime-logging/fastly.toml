# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = [""]
description = "Realtime logging: the log interface's two functions, and what open will accept"
language = "other"
manifest_version = 3
name = "realtime-logging"
service_id = ""

[scripts]
  build = "cargo build --target wasm32-wasip2 && mkdir -p bin && cp target/wasm32-wasip2/debug/realtime_logging.wasm bin/main.wasm"

[setup]

  [setup.log_endpoints]

    [setup.log_endpoints.my_endpoint]
      provider = "HTTPS"
