# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = [""]
description = "Two backend requests in flight at once, using send-async and select-with-timeout"
language = "other"
manifest_version = 3
name = "two-requests-at-once"
service_id = ""

[local_server]
  [local_server.backends.http_me]
    url = "https://http-me.fastly.dev"

[scripts]
  build = "cargo build --target wasm32-wasip2 && mkdir -p bin && cp target/wasm32-wasip2/debug/two_requests_at_once.wasm bin/main.wasm"
