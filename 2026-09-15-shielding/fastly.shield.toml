# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = [""]
description = "Shielding: reading shield-info, and forwarding to a shield when you aren't on it"
language = "other"
manifest_version = 3
name = "shielding"
service_id = ""

[local_server]

  [local_server.backends]

    [local_server.backends.origin]
      url = "https://http-me.fastly.dev"

  # This instance plays the shield POP itself.
  [local_server.shielding_sites]
    "pdx-or-us" = "Local"

[scripts]
  build = "cargo build --target wasm32-wasip2 && mkdir -p bin && cp target/wasm32-wasip2/debug/shielding.wasm bin/main.wasm"

[setup]

  [setup.backends]

    [setup.backends.origin]
      address = "http-me.fastly.dev"
      description = "http-me test origin"
      port = 443
