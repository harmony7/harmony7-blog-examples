# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = [""]
description = "Making an outbound request to a backend by hand"
language = "other"
manifest_version = 3
name = "calling-a-backend"
service_id = ""

[local_server]
  [local_server.backends.http_me]
    url = "https://http-me.fastly.dev"

[scripts]
  build = "cargo build --target wasm32-wasip2 && mkdir -p bin && cp target/wasm32-wasip2/debug/calling_a_backend.wasm bin/main.wasm"
